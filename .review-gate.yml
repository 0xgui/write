# agent-pr-gate config. See https://github.com/0xgui/agent-pr-gate#configuration
default_tier: medium

# Highest matching tier across all changed files wins.
tiers:
  low:
    - "*.md"
    - "assets/**"
  medium:
    - "src/**"
    - "tests/**"
    - "Makefile"
  # High = breaking: the on-disk document/backup/cursor formats, CI, and the gate itself.
  high:
    - "src/storage.*"
    - "src/positions.*"
    - ".github/workflows/**"
    - ".github/CODEOWNERS"
    - ".review-gate.yml"

evidence:
  sections:
    - Testing
    - Risk
    - name: How to revert
      aliases: [Rollback, Revert plan]
  require_green_ci: true

routing:
  approvals:
    low: 0
    medium: 0
    high: 0
  # Single-maintainer repository. Low and medium PRs need no review. Breaking (high-tier)
  # changes need a CODEOWNERS approval. Evidence sections and a green build apply to all.
  high_requires_codeowners: true

rounds:
  cap: 2
  review_states: [CHANGES_REQUESTED]

maintainers:
  - 0xgui
