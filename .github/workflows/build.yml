name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ make pkg-config libgtk-4-dev libfontconfig-dev
      - name: Build
        run: make
      - name: Test
        run: make test
